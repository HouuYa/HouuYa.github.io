<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 268" fill="none" aria-label="Orion constellation — HouuYa's Blog">
  <!--
    오리온자리 8성, J2000.0 실측 좌표 기반 (등각 투영, 허리띠 기울기 ~37°)
    Meissa(머리) - Betelgeuse/Bellatrix(어깨) - Mintaka/Alnilam/Alnitak(허리띠) - Saiph/Rigel(발)
    별 반경은 실제 밝기(겉보기 등급) 순서를 유지하되 소형 아이콘에서도 보이도록 소폭 확대:
      Rigel > Betelgeuse > Bellatrix = Alnilam > Alnitak = Saiph > Mintaka > Meissa
    Betelgeuse(amber #e8a55a)·Rigel(teal #5db8a6)만 고정색, 나머지는 currentColor —
    부모 color로 라이트/다크 배경 모두 대응 (Nav: $color-ink, Footer: $color-on-dark)
  -->

  <!-- 연결선 9개 -->
  <g stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
    <line x1="78" y1="18" x2="18" y2="48"/>   <!-- Meissa - Betelgeuse -->
    <line x1="78" y1="18" x2="108" y2="61"/>  <!-- Meissa - Bellatrix -->
    <line x1="18" y1="48" x2="61" y2="161"/>  <!-- Betelgeuse - Alnitak (왼쪽 몸통) -->
    <line x1="108" y1="61" x2="88" y2="141"/> <!-- Bellatrix - Mintaka (오른쪽 몸통) -->
    <line x1="88" y1="141" x2="75" y2="152"/> <!-- 허리띠: Mintaka - Alnilam -->
    <line x1="75" y1="152" x2="61" y2="161"/> <!-- 허리띠: Alnilam - Alnitak -->
    <line x1="61" y1="161" x2="40" y2="253"/> <!-- Alnitak - Saiph (왼발) -->
    <line x1="88" y1="141" x2="140" y2="236"/><!-- Mintaka - Rigel (오른발) -->
    <line x1="40" y1="253" x2="140" y2="236"/><!-- Saiph - Rigel -->
  </g>

  <!-- 별 8개 (밝기순 크기) -->
  <circle cx="78" cy="18" r="4" fill="currentColor"/>      <!-- Meissa -->
  <circle cx="18" cy="48" r="9" fill="#e8a55a"/>           <!-- Betelgeuse -->
  <circle cx="108" cy="61" r="5.5" fill="currentColor"/>   <!-- Bellatrix -->
  <circle cx="88" cy="141" r="4.5" fill="currentColor"/>   <!-- Mintaka -->
  <circle cx="75" cy="152" r="5.5" fill="currentColor"/>   <!-- Alnilam -->
  <circle cx="61" cy="161" r="5" fill="currentColor"/>     <!-- Alnitak -->
  <circle cx="40" cy="253" r="5" fill="currentColor"/>     <!-- Saiph -->
  <circle cx="140" cy="236" r="10" fill="#5db8a6"/>        <!-- Rigel -->
</svg>
