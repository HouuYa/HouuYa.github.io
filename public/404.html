<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — HouuYa's Blog</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #faf9f5;
      color: #141413;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .wrap { max-width: 480px; padding: 2rem; }
    h1 { font-size: 4rem; font-weight: 400; margin: 0 0 1rem; }
    p { color: #6c6a64; margin: 0 0 2rem; }
    a {
      background: #cc785c;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    a:hover { background: #a9583e; }
  </style>
  <script>
    // Jekyll URL 패턴 → Astro URL 리다이렉트
    // e.g. /2024/01/01/post-title/ → /posts/2024-01-01-post-title/
    const path = window.location.pathname;
    const jekyllPost = path.match(/^\/(\d{4})\/(\d{2})\/(\d{2})\/(.+?)\/?$/);
    if (jekyllPost) {
      const [, y, m, d, slug] = jekyllPost;
      window.location.replace(`/posts/${y}-${m}-${d}-${slug}/`);
    }
  </script>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <p>페이지를 찾을 수 없습니다.</p>
    <a href="/">홈으로 돌아가기</a>
  </div>
</body>
</html>
