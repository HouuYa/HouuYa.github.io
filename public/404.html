<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 — HouuYa's Blog</title>
  <script>
    // Jekyll URL 마이그레이션 호환 리다이렉터
    (function() {
      var path = window.location.pathname;
      // 레거시 카테고리/포스트 패턴 처리
      if (path.startsWith('/category/') || path.startsWith('/tag/')) {
        window.location.replace('/posts/');
        return;
      }
      // 일반적인 레거시 포스트 URL 리다이렉션 시도
      if (path !== '/' && !path.startsWith('/posts/') && !path.startsWith('/assets/')) {
        var cleanPath = path.replace(/\/$/, '');
        var segments = cleanPath.split('/');
        var lastSegment = segments[segments.length - 1];
        if (lastSegment) {
          window.location.replace('/posts/' + lastSegment + '/');
          return;
        }
      }
    })();
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #faf9f5;
      color: #141413;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    h1 { font-size: 3rem; margin-bottom: 0.5rem; color: #cc785c; }
    p { font-size: 1.25rem; color: #66635c; margin-bottom: 2rem; }
    a {
      display: inline-block;
      background-color: #cc785c;
      color: #faf9f5;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { background-color: #a9583e; }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>요청하신 페이지를 찾을 수 없습니다.</p>
  <a href="/">메인으로 돌아가기</a>
</body>
</html>
